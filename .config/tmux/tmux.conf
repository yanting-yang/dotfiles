set -g mouse on
set -g pane-border-status top
set -g set-clipboard on
set -g status-left-length 100

# Start zsh directly; a login /bin/bash re-runs the slow cluster /etc/profile on every new window.
run-shell 'tmux set -g default-shell "$(command -v zsh)"'

set -g status-right-length 100
set -g status-right ''
set -ag status-right 'Pane: '
set -ag status-right '#[range=control|0][|]#[norange]'
set -ag status-right '#[range=control|1][-]#[norange]'
set -ag status-right ' Window: '
set -ag status-right '#[range=control|2][<]#[norange]'
set -ag status-right '#[range=control|3][>]#[norange]'
set -ag status-right '#[range=control|4][+]#[norange]'
set -ag status-right '#[range=control|5][x]#[norange]'
set -ag status-right ' Session: '
set -ag status-right '#[range=control|6][-]#[norange]'
set -ag status-right '#[range=control|7][x]#[norange]'
set -ag status-right ' %Y-%m-%d %H:%M %Z'
bind -n MouseDown1Control0 split-window -h
bind -n MouseDown1Control1 split-window -v
bind -n MouseDown1Control2 swap-window -s : -t :-1
bind -n MouseDown1Control3 swap-window -s : -t :+1
bind -n MouseDown1Control4 new-window -a
bind -n MouseDown1Control5 kill-window
bind -n MouseDown1Control6 detach-client
bind -n MouseDown1Control7 kill-session
