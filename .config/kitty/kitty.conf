# Fonts
font_size 16
font_family family="Maple Mono NF CN"
bold_font auto
italic_font auto
bold_italic_font auto

# Window layout
remember_window_size yes
hide_window_decorations yes
window_padding_width 15
background_opacity 0.8
background_blur 30

# Tab bar
tab_bar_edge top

# Color scheme
include current-theme.conf
